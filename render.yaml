services:
  - type: web
    name: laf-backend
    runtime: node
    buildCommand: npm ci && npm run build --workspace=packages/shared
    startCommand: node node_modules/.bin/tsx backend/src/server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: laf-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: laf-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false   # set this to your Netlify URL after deploying frontend
      - key: PORT
        value: 10000

databases:
  - name: laf-db
    databaseName: lostandfound
    user: laf_user
    plan: free

redis:
  - name: laf-redis
    plan: free
